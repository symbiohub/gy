<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面打磨中 | Symbiohub</title>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #64707d;
      --paper: #f6f7f4;
      --line: #d9dee7;
      --blue: #274156;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }

    main {
      width: min(680px, calc(100vw - 40px));
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 40px;
      box-shadow: 0 18px 50px rgba(24, 37, 52, 0.1);
    }

    .label {
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 12px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Symbiohub</div>
    <h1>页面正在重新打磨</h1>
    <p>这个入口暂时下线。内容仍在内部整理中，待边界、证据链和表达方式确认后再开放。</p>
  </main>
</body>
</html>
